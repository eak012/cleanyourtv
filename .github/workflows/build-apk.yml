name: Build Clean TV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดโปรเจกต์ (Checkout)
        uses: actions/checkout@v4

      - name: ติดตั้ง JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ตั้งค่า Gradle และ Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: launcher

      - name: ให้สิทธิ์รันไฟล์ gradlew
        working-directory: launcher
        run: chmod +x gradlew

      - name: สั่งบิลด์ไฟล์ Debug APK
        working-directory: launcher
        run: ./gradlew assembleDebug

      - name: อัปโหลดไฟล์ APK เก็บไว้ใน Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-Launcher-Debug
          path: launcher/app/build/outputs/apk/debug/*.apk
