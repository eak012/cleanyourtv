name: Inspect Repository Structure

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List All Files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== FILES IN ROOT ==="
          ls -la
          echo "=== SEARCH FOR BUILD FILES ==="
          find . -maxdepth 3 -not -path '*/.*'
