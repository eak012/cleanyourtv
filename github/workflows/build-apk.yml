name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # ช่วยให้กดปุ่มสั่งรันเองได้จากหน้าเว็บ GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ดึงโค้ดโปรเจกต์ (Checkout)
        uses: actions/checkout@v4

      - name: ติดตั้ง JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ตั้งค่า Gradle และ Cache
        uses: gradle/actions/setup-gradle@v3

      - name: ให้สิทธิ์รันไฟล์ gradlew
        run: chmod +x gradlew

      - name: สั่งบิลด์ไฟล์ Debug APK
        run: ./gradlew assembleDebug

      - name: อัปโหลดไฟล์ APK เก็บไว้ใน Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
